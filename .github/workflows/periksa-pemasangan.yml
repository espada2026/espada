name: Periksa pemasangan
# Tiap hari 06.00 WIB (23.00 UTC): membandingkan basis data produksi dengan kode terbaru (supabase/demo/periksa_pemasangan.sql; HANYA MEMBACA) dan
# membuka satu issue bila ada yang KURANG/BEDA (migrasi belum dijalankan, atau fungsi bukan versi terbaru). Memakai SIGARDA_DB_URL (peran baca-saja,
# sama dengan cadangan mingguan). Belum diisi = dilewati. Log hanya memuat nama objek dan status, tanpa data atau alamat sambungan.
# Edge Function tidak dapat diperiksa dari SQL. Panduan: docs/penerapan-otomatis.md.
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: periksa-pemasangan
  cancel-in-progress: false
jobs:
  periksa:
    if: github.repository == 'tribudi3267/sigarda'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/cadangan/package-lock.json
      - run: npm ci --prefix scripts/cadangan
      - name: Periksa pemasangan
        env:
          SIGARDA_DB_URL: ${{ secrets.SIGARDA_DB_URL }}
        run: node scripts/penerapan/jalankan.mjs periksa --lewati-bila-kosong
      - name: Tutup issue ketidaksesuaian yang masih terbuka
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "${{ github.repository }}" --state open --search "Pemasangan tidak sesuai in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "${{ github.repository }}" --comment "Sesuai lagi pada ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
      - name: Buka issue bila tidak sesuai
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ada=$(gh issue list --repo "${{ github.repository }}" --state open --search "Pemasangan tidak sesuai in:title" --json number --jq '.[0].number')
          if [ -n "$ada" ]; then
            gh issue comment "$ada" --repo "${{ github.repository }}" --body "Masih tidak sesuai: $url"
          else
            gh issue create --repo "${{ github.repository }}" --title "Pemasangan tidak sesuai dengan kode terbaru" --body "Pemeriksaan harian menemukan ketidaksesuaian antara basis data produksi dan kode (migrasi belum dijalankan, atau fungsi bukan versi terbaru), atau pemeriksaan gagal dijalankan. Daftar objeknya ada di log (tanpa data pribadi): $url. Panduan: docs/penerapan-otomatis.md."
          fi
