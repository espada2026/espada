    <!-- Halaman muka hasil prarender (di dalam #root, data-pra) disembunyikan bagi yang akan langsung masuk ke aplikasi: aturannya sama dengan src/lib/ruteLogic.js (dijaga uji/rute.mjs). -->
    <style>html.app [data-pra]{display:none}</style>
    <!-- Tema tampilan terakhir yang diketahui (src/lib/temaStore.js; KUNCI_TEMA sama): dipasang sebelum halaman tergambar supaya tidak berkedip. -->
    <script id="pilih-tema">
      (function () {
        try {
          var t = localStorage.getItem('sigarda_tema');
          if (t === 'asli' || t === 'siaga') document.documentElement.setAttribute('data-tema', t);
        } catch (e) {}
      })();
    </script>
    <script id="pilih-rute">
      (function () {
        try {
          var s = location.search, h = location.hash, sesi = false, i, k;
          try {
            for (i = 0; i < localStorage.length; i++) {
              k = localStorage.key(i);
              if (/^sb-.+-auth-token$/.test(k) || k === 'sigarda_lokal_sesi') { sesi = true; break; }
            }
          } catch (e) {}
          var publik = /(^|[?&])(v|berkas)(=|&|$)/.test(s);
          var aplikasi = h === '#masuk' || sesi || /[?&](masuk|data|ulang|buka)=/.test(s);
          if (publik || (h !== '#beranda' && aplikasi)) document.documentElement.className = 'app';
        } catch (e) {}
      })();
    </script>
